<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hva skal vi se</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#272b35;--text:#e8eaf0;--mute:#8b93a5;--acc:#f5b301;--ok:#3ecf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;padding:10px 14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0 10px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input[type=text],input[type=password]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--mute)}
button.on{background:var(--acc);color:#000;border-color:var(--acc)}
button.primary{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar label{color:var(--mute);display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#222}
.card .m{padding:8px}.card .m b{display:block;font-size:13px}.card .m span{color:var(--mute);font-size:12px}
.card.seen img,.card.skipped img{opacity:.35}
.tick.skip{background:#e5484d;color:#fff}
.tick{position:absolute;top:6px;right:6px;background:var(--ok);color:#000;border-radius:50%;width:22px;height:22px;text-align:center;font-style:normal;font-weight:700;line-height:22px}
.rank{position:absolute;top:6px;left:6px;background:#000c;border-radius:6px;padding:1px 7px;font-weight:700}
.badge{display:inline-block;background:#2a2f3b;border-radius:6px;padding:1px 7px;font-size:11px;margin:2px 3px 0 0}
.badge.hit{background:#1d4d3a;color:#b9f5d8}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:flex;gap:16px;padding:16px}
.sheet img{width:220px;align-self:flex-start;border-radius:10px}
.sheet h2{margin:0 0 4px}.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mute{color:var(--mute)}
.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.section h3{margin:0 0 8px}
progress{width:100%;height:10px}
.checks label{display:inline-flex;gap:6px;margin:0 14px 6px 0;align-items:center}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000d;padding:8px 16px;border-radius:20px;display:none;z-index:20}
.card img.plogo,.sheet img.plogo{width:24px;height:24px;aspect-ratio:1;border-radius:6px;margin:4px 4px 0 0;vertical-align:middle;display:inline-block;object-fit:contain;align-self:auto}
.card.seen img.plogo,.card.skipped img.plogo{opacity:1}
.badge.paid{background:transparent;border:1px solid #b8860b;color:#f5b301}
.people{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:flex;gap:8px;align-items:center;padding:4px 14px 4px 4px;border-radius:30px;text-align:left}
.chip img{width:36px;height:36px;border-radius:50%;object-fit:cover}
#sf{flex:1;min-width:170px;max-width:380px;margin-left:8px;position:relative}#sf input{width:100%}
#sug{position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:70vh;overflow:auto;display:none;z-index:15}
.s-item{display:flex;gap:10px;align-items:center;padding:6px 10px;cursor:pointer}
.s-item:hover,.s-item.act{background:#232733}
.s-item img{width:30px;height:44px;object-fit:cover;border-radius:4px;background:#222;flex:none}
.s-item.person img{border-radius:50%;height:30px}
.s-item small{color:var(--mute);display:block}
.pc .m span{display:block}
body.nopaid .badge.paid{display:none}
.fc .m progress{width:100%;height:6px;margin-top:6px}
.chip.fr img{border-radius:6px;width:28px;height:40px}
.dd{position:relative}
#navDD{display:contents}
#menuBtn{display:none}
#filtDD .panel{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;z-index:30;min-width:230px;flex-direction:column;gap:8px}
#filtDD.open .panel{display:flex}
#filtDD .panel button{width:100%;text-align:left}
#surpriseBtn{margin-left:auto}
.brk{display:none}
.dz{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;margin:12px 0}
@media(max-width:760px){
  header{gap:8px}
  header h1{flex:1;margin:0;order:1}
  #navDD{display:block;order:2}
  #menuBtn{display:inline-block}
  #nav{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;z-index:30;flex-direction:column;min-width:170px}
  #navDD.open #nav{display:flex}
  #nav button{text-align:left}
  #filtDD{order:3}
  .brk{display:block;flex-basis:100%;height:0;order:4}
  #sf{order:5;margin-left:0;flex:1 1 0;max-width:none;min-width:0}
  #surpriseBtn{order:6;margin-left:0}
  .bar select{flex:1 1 140px;min-width:0}
  .bar label{flex:1 1 150px}
}
@media(max-width:600px){.sheet{flex-direction:column}.sheet img{width:140px}}
</style>
</head>
<body>
<header>
  <h1>🎬 Hva skal vi se</h1>
  <div class="dd" id="navDD">
    <button id="menuBtn">☰ Menu</button>
    <nav id="nav">
      <button data-tab="discover" class="on">Discover</button>
      <button data-tab="top">Top 100</button>
      <button data-tab="actors">Actors</button>
      <button data-tab="directors">Directors</button>
      <button data-tab="franchises">Franchises</button>
      <button data-tab="friend">Friend</button>
      <button data-tab="lists">My lists</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </div>
  <form id="sf"><input type="text" id="q" placeholder="Search title, actor, director…" autocomplete="off"><div id="sug"></div></form>
  <div class="dd" id="filtDD">
    <button id="filtBtn">⚙ Filters</button>
    <div class="panel">
      <button id="paidBtn" title="Hide titles that cost extra (rent/buy)">$ Hide paid</button>
      <button id="naBtn" title="Hide titles that are not on any of your services">✕ Hide unavailable</button>
    </div>
  </div>
  <span class="brk"></span>
  <button class="primary" id="surpriseBtn">🎲 Surprise me</button>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const IMG='https://image.tmdb.org/t/p/w342', REGION='NO';
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cfg=LS('cfg',{key:'',providers:[],provNames:{}});
let seen=LS('seen',{}), want=LS('want',{}), skip=LS('skip',{});
const hideSkipOn=()=>filters.hideSkip!==false;
let filters=LS('filters',{genre:'',rating:'6.5',runtime:'',decade:'',sort:'popularity.desc',hideSeen:true});
let genres=[], tab='discover', discoverPage=1, lastPick=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)};

async function api(path,params={}){
  const u=new URL('https://api.themoviedb.org/3'+path);
  const headers={};
  if(cfg.key.length>40) headers.Authorization='Bearer '+cfg.key; else u.searchParams.set('api_key',cfg.key);
  for(const [k,v] of Object.entries(params)) if(v!==''&&v!=null) u.searchParams.set(k,v);
  const r=await fetch(u,{headers});
  if(!r.ok) throw new Error(r.status===401?'Invalid TMDB key':'TMDB error '+r.status);
  return r.json();
}

/* ---------- discover params ---------- */
function discoverParams(extra={}){
  const f=filters, p={watch_region:REGION,with_watch_providers:cfg.providers.join('|'),with_watch_monetization_types:'flatrate',
    include_adult:false,'vote_count.gte':200,'vote_average.gte':f.rating,with_genres:f.genre,'with_runtime.lte':f.runtime,sort_by:f.sort};
  if(f.sort==='primary_release_date.desc') p['vote_count.gte']=50;
  if(f.decade){const d=+f.decade; if(d===1900){p['primary_release_date.lte']='1979-12-31'} else {p['primary_release_date.gte']=d+'-01-01';p['primary_release_date.lte']=(d+9)+'-12-31'}}
  return {...p,...extra};
}
const yr=m=>(m.release_date||'').slice(0,4);
const seenTest=id=>!!seen[id];

/* ---------- rendering ---------- */
function cardHTML(m,rank,badges){
  const s=seenTest(m.id), k=!s&&!!skip[m.id];
  return `<div class="card ${s?'seen':''} ${k?'skipped':''}" data-id="${m.id}">
    ${m.poster_path?`<img loading="lazy" src="${IMG+m.poster_path}">`:'<img>'}
    ${s?'<i class="tick">✓</i>':k?'<i class="tick skip">⊘</i>':''}${rank?`<span class="rank">${rank}</span>`:''}
    <div class="m"><b>${esc(m.title)}</b><span>${yr(m)}${m.vote_average?' · ★'+m.vote_average.toFixed(1):''}</span>${friendTag(m.id)}<div class="pl" data-pl="${m.id}">${provHTML(m.id)}</div></div></div>`;
}
const slim=m=>({id:m.id,title:m.title,release_date:m.release_date,poster_path:m.poster_path,vote_average:m.vote_average});

function setTab(t){
  tab=t; omActive=false;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ({discover:renderDiscover,top:renderTop,lists:renderLists,settings:renderSettings,search:renderSearch,
    actors:()=>renderPeopleTab('actors'),directors:()=>renderPeopleTab('directors'),franchises:renderFranchises,friend:renderFriend})[t]();
}

function filterBar(){
  const opt=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`;
  return `<div class="bar">
   <select id="fGenre">${opt('','Any genre',filters.genre)}${genres.map(g=>opt(g.id,g.name,filters.genre)).join('')}</select>
   <select id="fRating">${[['0','Any rating'],['6','★ 6+'],['6.5','★ 6.5+'],['7','★ 7+'],['7.5','★ 7.5+'],['8','★ 8+']].map(([v,l])=>opt(v,l,filters.rating)).join('')}</select>
   <select id="fRuntime">${[['','Any length'],['100','Under 100 min'],['120','Under 2 h'],['150','Under 2.5 h']].map(([v,l])=>opt(v,l,filters.runtime)).join('')}</select>
   <select id="fDecade">${[['','Any era'],['2020','2020s'],['2010','2010s'],['2000','2000s'],['1990','1990s'],['1980','1980s'],['1900','Before 1980']].map(([v,l])=>opt(v,l,filters.decade)).join('')}</select>
   <select id="fSort">${[['popularity.desc','Popular'],['vote_average.desc','Best rated'],['primary_release_date.desc','Newest']].map(([v,l])=>opt(v,l,filters.sort)).join('')}</select>
   <label><input type="checkbox" id="fHide" ${filters.hideSeen?'checked':''}> hide seen</label>
   <label><input type="checkbox" id="fSkip" ${hideSkipOn()?'checked':''}> hide not interested</label></div>`;
}
function bindFilters(rerender){
  const map={fGenre:'genre',fRating:'rating',fRuntime:'runtime',fDecade:'decade',fSort:'sort'};
  for(const [id,k] of Object.entries(map)) $('#'+id).onchange=e=>{filters[k]=e.target.value;save('filters',filters);rerender()};
  $('#fHide').onchange=e=>{filters.hideSeen=e.target.checked;save('filters',filters);rerender()};
  $('#fSkip').onchange=e=>{filters.hideSkip=e.target.checked;save('filters',filters);rerender()};
}

async function renderDiscover(){
  if(!ready()) return;
  discoverPage=1;
  $('#main').innerHTML=filterBar()+'<div class="grid" id="grid"></div><p><button id="more">Load more</button></p>';
  bindFilters(renderDiscover);
  $('#more').onclick=()=>loadDiscover();
  loadDiscover();
}
async function loadDiscover(){
  try{
    let shown=0, tries=0;
    while(shown<12 && tries<6){
      const r=await api('/discover/movie',discoverParams({page:discoverPage++}));
      const list=r.results.filter(m=>!(filters.hideSeen&&seenTest(m.id))&&!(hideSkipOn()&&skip[m.id]));
      $('#grid').insertAdjacentHTML('beforeend',list.map(m=>cardHTML(m)).join(''));
      fillProviders($('#grid'));
      shown+=list.length; tries++;
      if(discoverPage>r.total_pages){$('#more').style.display='none';break}
    }
    if(!$('#grid').children.length) $('#grid').innerHTML='<p class="mute">Nothing matches. Loosen the filters.</p>';
  }catch(e){toast(e.message)}
}

async function renderTop(){
  if(!ready()) return;
  $('#main').innerHTML='<p class="mute">Loading…</p>';
  try{
    const base={watch_region:REGION,with_watch_providers:cfg.providers.join('|'),with_watch_monetization_types:'flatrate',include_adult:false,'vote_count.gte':3000,sort_by:'vote_average.desc'};
    const pages=await Promise.all([1,2,3,4,5].map(p=>api('/discover/movie',{...base,page:p})));
    const list=pages.flatMap(r=>r.results).slice(0,100);
    const n=list.filter(m=>seenTest(m.id)).length;
    $('#main').innerHTML=`<div class="section"><h3>Top ${list.length} on your services</h3>
      <div class="mute">Ranked by TMDB user rating (min. 3000 votes) among movies streaming on your Norwegian services. You've seen ${n} of ${list.length}.</div>
      <progress value="${n}" max="${list.length}"></progress>
      <div class="bar" style="margin:10px 0 0"><label><input type="checkbox" id="topHide"> hide seen</label>
      <label><input type="checkbox" id="topSkip" ${hideSkipOn()?'checked':''}> hide not interested</label></div></div>
      <div class="grid" id="grid"></div>`;
    const draw=()=>{const h=$('#topHide').checked,hs=$('#topSkip').checked;$('#grid').innerHTML=list.map((m,i)=>(h&&seenTest(m.id))||(hs&&skip[m.id])?'':cardHTML(m,i+1)).join('');fillProviders($('#grid'))};
    $('#topSkip').onchange=draw;
    $('#topHide').onchange=draw; draw();
  }catch(e){toast(e.message)}
}

function renderLists(){
  const sv=Object.values(seen).sort((a,b)=>(b.ts||0)-(a.ts||0)), wl=Object.values(want).sort((a,b)=>(b.ts||0)-(a.ts||0));
  $('#main').innerHTML=`
  <div class="section"><h3>Letterboxd (your own export)</h3>
    <div class="mute">Export your data on letterboxd.com (Settings → Data → Export your data), then drop everything here: the zip, the unzipped folder or loose files, original names. The app uses <b>watched.csv</b>, <b>ratings.csv</b> and <b>watchlist.csv</b> and ignores the rest. It only adds to your lists and never removes anything.</div>
    <div id="mDrop" class="dz">Drop the export here<br><span class="mute">zip, folder or files</span><br>
      <button id="mPickFiles" style="margin-top:8px">Choose files or zip…</button> <button id="mPickFolder">Choose folder…</button>
      <input type="file" id="mFiles" multiple accept=".csv,.zip" hidden><input type="file" id="mFolder" webkitdirectory hidden></div>
    <div id="mFound" class="mute"></div>
    <progress id="impBar" value="0" max="1" style="display:none"></progress> <span id="imp" class="mute"></span></div>
  <div class="section"><h3>Seen (${sv.length}) <button id="exp" style="float:right">Export CSV</button></h3>
    <div class="grid" id="gSeen">${sv.map(m=>cardHTML(m)).join('')||'<span class="mute">Empty. Mark movies as seen or import from Letterboxd.</span>'}</div></div>
  <div class="section"><h3>Not interested (${Object.keys(skip).length})</h3>
    <div class="grid" id="gSkip">${Object.values(skip).sort((a,b)=>(b.ts||0)-(a.ts||0)).map(m=>cardHTML(m)).join('')||'<span class="mute">Empty. Use "Not interested" in a movie\'s details to hide it everywhere.</span>'}</div></div>
  <div class="section"><h3>Watchlist (${wl.length}) <button id="chk" style="float:right">Check what's streaming now</button></h3>
    <div class="grid" id="gWant">${wl.map(m=>cardHTML(m)).join('')||'<span class="mute">Empty.</span>'}</div></div>`;
  bindDropZone(['mDrop','mFiles','mFolder','mPickFiles','mPickFolder'],async list=>{
    try{
      const r=await collectLB(list), labels={watched:'watched',ratings:'ratings',watchlist:'watchlist'};
      const have=Object.keys(labels).filter(k=>r.out[k]);
      $('#mFound').textContent=have.length?'Found: '+Object.keys(labels).map(k=>(r.out[k]?'✅ ':'▫️ ')+labels[k]).join(' · '):'No watched.csv, ratings.csv or watchlist.csv found in what you added.';
      if(have.length) await importMine(r.out);
    }catch(e){toast(e.message)}
  });
  $('#exp').onclick=exportSeen;
  $('#chk').onclick=checkWatchlist;fillProviders($('#gWant'));
}
let omActive=false, lastQ='', onlyMine=true, hidePaid=LS('hidePaid',false);
function syncPaidBtn(){
  document.body.classList.toggle('nopaid',hidePaid);
  $('#paidBtn').classList.toggle('on',hidePaid);
  syncFiltBtn();
  $('#paidBtn').textContent=hidePaid?'$ Paid hidden':'$ Hide paid';
}
let hideNA=LS('hideNA',false);
function syncFiltBtn(){
  const n=(hidePaid?1:0)+(hideNA?1:0);
  $('#filtBtn').classList.toggle('on',n>0);
  $('#filtBtn').textContent='⚙ Filters'+(n?' · '+n:'');
}
function syncNaBtn(){
  $('#naBtn').classList.toggle('on',hideNA);
  syncFiltBtn();
  $('#naBtn').textContent=hideNA?'✕ Unavailable hidden':'✕ Hide unavailable';
}
$('#naBtn').onclick=()=>{hideNA=!hideNA;save('hideNA',hideNA);syncNaBtn();document.querySelectorAll('.card').forEach(applyOnlyMine)};
syncNaBtn();
$('#paidBtn').onclick=()=>{hidePaid=!hidePaid;save('hidePaid',hidePaid);syncPaidBtn();document.querySelectorAll('.card').forEach(applyOnlyMine)};
syncPaidBtn();
const provCache=LS('provCache3',{}), TTL=864e5;
const short=n=>({'Amazon Prime Video':'Prime','Amazon Prime Video with Ads':'Prime'}[n]||n);
const mineOf=no=>(no.flatrate||[]).filter(p=>cfg.providers.includes(p.provider_id)).map(p=>({id:p.provider_id,name:p.provider_name,logo:p.logo_path}));
function paidOf(no){
  const free=new Set((no.flatrate||[]).map(p=>p.provider_id)), out={};
  for(const k of ['rent','buy']) for(const p of no[k]||[]) if(cfg.providers.includes(p.provider_id)&&!free.has(p.provider_id)){
    (out[p.provider_id]??={id:p.provider_id,name:p.provider_name,kinds:[]}).kinds.push(k);
  }
  return Object.values(out);
}
const cached=id=>{const c=provCache[id];return c&&c.p&&Date.now()-c.t<TTL?c:null};
const logoImg=p=>`<img class="plogo" title="${esc(p.name)}" alt="${esc(p.name)}" src="https://image.tmdb.org/t/p/w45${p.logo}">`;
const paidTag=p=>`<span class="badge paid" title="Costs extra: ${p.kinds.join(' / ')} on ${esc(p.name)}">$ ${esc(short(p.name))} · ${p.kinds.join('/')}</span>`;
function provHTML(id){
  const c=cached(id); if(!c) return '';
  return c.l.map(logoImg).join('')+c.p.map(paidTag).join('')||'<span class="badge">not on your services</span>';
}
function applyOnlyMine(card){
  if(!card||card.closest('#gSeen,#gSkip')) return;
  const c=cached(card.dataset.id); let hide=false;
  if(c){
    if(hideNA&&!c.l.length&&!c.p.length) hide=true;
    if(hidePaid&&!c.l.length&&c.p.length) hide=true;
  }
  card.style.display=hide?'none':'';
}
async function fillProviders(root=document){
  const els=[...root.querySelectorAll('.pl')].filter(e=>!e.dataset.done);
  let i=0;
  const worker=async()=>{while(i<els.length){
    const el=els[i++], id=el.dataset.pl;
    if(!cached(id)){
      try{const r=await api(`/movie/${id}/watch/providers`);const no=r.results?.[REGION]||{};provCache[id]={t:Date.now(),l:mineOf(no),p:paidOf(no)}}catch{continue}
    }
    el.innerHTML=provHTML(id);el.dataset.done=1;applyOnlyMine(el.closest('.card'));
  }};
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
  save('provCache3',provCache);
}
async function checkWatchlist(){
  if(!ready()) return;
  Object.keys(want).forEach(id=>delete provCache[id]);
  $('#chk').textContent='Checking…';
  $('#gWant').querySelectorAll('.pl').forEach(e=>{delete e.dataset.done});
  await fillProviders($('#gWant'));
  const score=id=>{const c=cached(id);return c?(c.l.length?2:c.p.length?1:0):0};
  const order=Object.values(want).sort((a,b)=>score(b.id)-score(a.id));
  $('#gWant').innerHTML=order.map(m=>cardHTML(m)).join('');
  $('#chk').textContent="Check what's streaming now";
}

function renderSettings(){
  $('#main').innerHTML=`<div class="section"><h3>TMDB key</h3>
    <ol class="mute" style="margin:6px 0 10px;padding-left:20px">
      <li>Make a free account at <a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener" style="color:var(--acc)">themoviedb.org/signup</a> (skip if you have one).</li>
      <li>Open <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener" style="color:var(--acc)">themoviedb.org/settings/api</a>. Request an API key (choose "Personal / non-commercial"; any short description and URL like http://localhost is fine).</li>

// Built from the most acclaimed movies on TMDB (min 5000 votes): who directed / starred in the most of them.
let peopleCache=LS('peopleCache',null);
const pshown={actors:40,directors:40};
async function buildPeople(onProgress){
  const pages=await Promise.all([...Array(14).keys()].map(i=>api('/discover/movie',{include_adult:false,sort_by:'vote_average.desc','vote_count.gte':5000,page:i+1}).catch(()=>({results:[]}))));
  const seenM=new Set(), movies=pages.flatMap(r=>r.results).filter(m=>!seenM.has(m.id)&&seenM.add(m.id));
  const dir={}, act={}; let i=0, done=0;
  const add=(o,p,m)=>{const x=o[p.id]??={id:p.id,name:p.name,profile:p.profile_path,n:0,v:0};x.n++;x.v+=m.vote_average;if(!x.profile&&p.profile_path)x.profile=p.profile_path};
  const worker=async()=>{while(i<movies.length){const m=movies[i++];
    try{const c=await api(`/movie/${m.id}/credits`);
      c.crew.filter(p=>p.job==='Director').forEach(p=>add(dir,p,m));
      c.cast.filter(p=>p.order<6).forEach(p=>add(act,p,m));
    }catch{}
    onProgress(++done,movies.length)}};
  await Promise.all([...Array(8)].map(worker));
  const top=o=>Object.values(o).sort((a,b)=>b.n-a.n||b.v-a.v).slice(0,150);
  return {t:Date.now(),directors:top(dir),actors:top(act),films:movies.length};
}

// TMDB "collections". The list below is looked up by name once (so a wrong ID can't sneak in) and cached.
const FRANCHISES=['Star Wars','Harry Potter','The Lord of the Rings','The Hobbit','The Avengers','Iron Man','Captain America','Thor','Guardians of the Galaxy','Spider-Man','X-Men','Deadpool','Venom','The Dark Knight','Superman','Fast & Furious','James Bond','Mission: Impossible','Jurassic Park','Indiana Jones','Pirates of the Caribbean','Transformers','The Matrix','Terminator','Alien','Predator','Rocky','Rambo','Die Hard','Back to the Future','John Wick','Toy Story','Shrek','Ice Age','Despicable Me','Madagascar','How to Train Your Dragon','Kung Fu Panda','Cars','Finding Nemo','The Incredibles','Monsters, Inc.','Hotel Transylvania','The Hunger Games','The Twilight','Planet of the Apes','Star Trek','The Godfather','Jaws','Ghostbusters','Lethal Weapon','Mad Max','The Bourne','Scream','Halloween','Saw','The Conjuring','The Evil Dead','A Nightmare on Elm Street','Friday the 13th','Resident Evil','Kingsman','Men in Black','Austin Powers','The Hangover','American Pie','Pitch Perfect','Johnny English','Paddington','Dune','Avatar','Top Gun','Creed','Knives Out','Ocean\'s','Home Alone','Police Academy','Rush Hour','The Mummy','Taken','Jack Reacher','Sherlock Holmes','Mamma Mia!','Bad Boys'].map(n=>n+' Collection');
let franchiseCache=LS('franchiseCache',null);
let frPrefs=LS('frPrefs',{sort:'curated',hideDone:false});
const niceName=n=>String(n||'').replace(/ Collection$/,'');
function goFranchise(id,name){backTab=tab;backY=scrollY;showFranchise(id,name);scrollTo(0,0)}
async function buildFranchises(onProgress){
  const out=new Array(FRANCHISES.length); let i=0, done=0;
  const worker=async()=>{while(i<FRANCHISES.length){
    const idx=i++;
    try{
      const r=await api('/search/collection',{query:FRANCHISES[idx]}); const c=r.results[0];
      if(c){const d=await api('/collection/'+c.id); const parts=d.parts.filter(p=>p.release_date);
        if(parts.length>=2) out[idx]={i:idx,id:c.id,name:d.name,poster:d.poster_path||c.poster_path,ids:parts.map(p=>p.id)}}
    }catch{}
    onProgress(++done,FRANCHISES.length)}};
  await Promise.all([...Array(6)].map(worker));
  const seenC=new Set();
  return {v:1,t:Date.now(),list:out.filter(f=>f&&!seenC.has(f.id)&&seenC.add(f.id))};
}
async function renderFranchises(){
  if(!ready()) return;
  if(!franchiseCache||franchiseCache.v!==1||Date.now()-franchiseCache.t>2592e6){
    $('#main').innerHTML=`<div class="section"><h3>Building the franchise list…</h3><div class="mute">One-time setup (roughly 15–30 seconds).</div><progress id="pp" value="0" max="1"></progress></div>`;
    try{
      franchiseCache=await buildFranchises((d,n)=>{const p=$('#pp');if(p){p.max=n;p.value=d}});
      save('franchiseCache',franchiseCache);
    }catch(e){toast(e.message);return}
    if(tab!=='franchises') return;
  }
  let list=franchiseCache.list.map(f=>({...f,n:f.ids.length,s:f.ids.filter(id=>seen[id]).length}));
  if(frPrefs.hideDone) list=list.filter(f=>f.s<f.n);
  const startedKey=f=>f.s>0&&f.s<f.n?f.n-f.s:1000+f.i;
  if(frPrefs.sort==='films') list.sort((a,b)=>b.n-a.n||a.i-b.i);
  else if(frPrefs.sort==='finish') list.sort((a,b)=>startedKey(a)-startedKey(b));
  const opt=(v,l)=>`<option value="${v}" ${frPrefs.sort===v?'selected':''}>${l}</option>`;

async function lbMatch(name,year){
  const key=name+'|'+year; if(key in matchCache) return matchCache[key];
  let res=await api('/search/movie',{query:name,year});
  if(!res.results.length&&year) res=await api('/search/movie',{query:name});
  const m=res.results[0];
  return matchCache[key]=m?slim(m):0;
}
async function readLB(file){
  const rows=parseCSV(await file.text()); const head=rows.shift().map(h=>h.trim().toLowerCase());
  const iN=head.indexOf('name'), iY=head.indexOf('year'), iR=head.indexOf('rating');
  if(iN<0) throw new Error('Not a Letterboxd CSV: '+file.name);
  return rows.map(r=>({name:r[iN],year:r[iY],rating:iR>=0?parseFloat(r[iR]):null})).filter(x=>x.name);
}
async function importFriend(files,name){
  const parts={};
  for(const k of ['watchlist','ratings','liked','watched']) if(files[k]) parts[k]=await readLB(files[k]);
  if(!Object.keys(parts).length) throw new Error('Choose at least one file');
  const all=new Map(); Object.values(parts).flat().forEach(x=>all.set(x.name+'|'+x.year,x));
  const todo=[...all.values()]; let i=0, done=0;
  const bar=$('#fbar'); bar.style.display='block'; bar.max=todo.length; bar.value=0;
  const worker=async()=>{while(i<todo.length){const x=todo[i++];
    try{await lbMatch(x.name,x.year)}catch{}
    done++; bar.value=done; $('#fimp').textContent=`Matching films… ${done}/${todo.length}`}};
  await Promise.all([...Array(6)].map(worker));
  const get=x=>matchCache[x.name+'|'+x.year], old=friend||{};
  const f={name,updated:Date.now(),watchlist:old.watchlist||[],ratings:old.ratings||{},liked:old.liked||[],watched:old.watched||[],movies:{...(old.movies||{})}};
  const keep=(x)=>{const m=get(x);if(m)f.movies[m.id]=m;return m};
  if(parts.watchlist) f.watchlist=parts.watchlist.map(keep).filter(Boolean).map(m=>m.id);
  if(parts.ratings){f.ratings={};parts.ratings.forEach(x=>{const m=keep(x);if(m&&x.rating)f.ratings[m.id]=x.rating})}
  if(parts.liked) f.liked=parts.liked.map(keep).filter(Boolean).map(m=>m.id);
  if(parts.watched) f.watched=parts.watched.map(keep).filter(Boolean).map(m=>m.id);

  friend=f; safeSave('friend',f); safeSave('matchCache',matchCache);

let fPending={};
const LBLABEL={watchlist:'watchlist',ratings:'ratings',liked:'likes (♥)',watched:'watched'};
// Reads the CSVs out of a .zip (stored or deflated) using the browser's built-in decompression.
async function unzipFiles(file){
  const buf=new DataView(await file.arrayBuffer()), u8=new Uint8Array(buf.buffer);
  let e=u8.length-22; while(e>=0&&buf.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error(file.name+' is not a valid zip');
  const n=buf.getUint16(e+10,true); let p=buf.getUint32(e+16,true); const out=[];
  for(let i=0;i<n;i++){
    if(buf.getUint32(p,true)!==0x02014b50) break;
    const method=buf.getUint16(p+10,true), csize=buf.getUint32(p+20,true), nlen=buf.getUint16(p+28,true), xlen=buf.getUint16(p+30,true), clen=buf.getUint16(p+32,true), off=buf.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    p+=46+nlen+xlen+clen;
    if(name.endsWith('/')||!/\.csv$/i.test(name)) continue;
    const start=off+30+buf.getUint16(off+26,true)+buf.getUint16(off+28,true), data=u8.subarray(start,start+csize);
    let blob;
    if(method===0) blob=new Blob([data]);
    else if(method===8) blob=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    else continue;
    const f=new File([blob],name.split('/').pop(),{type:'text/csv'}); f._path=name; out.push(f);
  }
  return out;
}
// Files and folders from a drag-and-drop.
async function filesFromDrop(dt){
  const entries=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...dt.files];
  const out=[];
  const walk=async en=>{
    if(en.isFile){const f=await new Promise((res,rej)=>en.file(res,rej));f._path=en.fullPath.replace(/^\//,'');out.push(f)}
    else if(en.isDirectory){const rd=en.createReader();let batch;do{batch=await new Promise((res,rej)=>rd.readEntries(res,rej));for(const c of batch) await walk(c)}while(batch.length)}
  };
  for(const en of entries) await walk(en);
  return out;
}
// Decides by file name which export file is which; everything else is discarded.
async function collectLB(list){
  const files=[];
  for(const f of list){ if(/\.zip$/i.test(f.name)) files.push(...await unzipFiles(f)); else files.push(f) }
  const out={}, depth={}; let used=0;
  for(const f of files){
    const path=(f.webkitRelativePath||f._path||f.name).replace(/\\/g,'/').toLowerCase(), parts=path.split('/'), base=parts[parts.length-1];
    if(parts.includes('deleted')) continue;
    const role=base==='watchlist.csv'?'watchlist':base==='ratings.csv'?'ratings':base==='watched.csv'?'watched':base==='films.csv'&&(parts.includes('likes')||parts.length===1)?'liked':null;
    if(!role) continue;
    if(!(role in out)||parts.length<depth[role]){if(!(role in out)) used++;out[role]=f;depth[role]=parts.length}
  }
  return {out,ignored:Math.max(0,files.length-used)};
}

function friendIds(k){

  if(k==='picks') return [...new Set([...loved,...liked,...friend.watchlist])];

}

function picksScore(id,likedSet,wlSet){const r=friend.ratings[id]||0;return (r>=4.5?3:r>=4?2:r>=3.5?1:0)+(likedSet.has(id)?2:0)+(wlSet.has(id)?1:0)}

async function drawFriend(){

  const mv=id=>friend.movies[id], r=id=>friend.ratings[id]||0, va=id=>mv(id).vote_average||0;
  const likedSet=new Set(friend.liked||[]), wlSet=new Set(friend.watchlist);
  if(fp.sort==='rating'&&fp.kind==='picks'){const sc=new Map(list.map(id=>[id,picksScore(id,likedSet,wlSet)]));list.sort((a,b)=>sc.get(b)-sc.get(a)||r(b)-r(a)||va(b)-va(a))}

/* ---------- Letterboxd import / export ---------- */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true; else if(c==','){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.length>1||row[0])rows.push(row);row=[]}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function bindDropZone(ids,take){
  const [dz,fi,fo,pf,pd]=ids.map(i=>$('#'+i));
  fi.onchange=e=>take([...e.target.files]); fo.onchange=e=>take([...e.target.files]);
  pf.onclick=()=>fi.click(); pd.onclick=()=>fo.click();
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.style.borderColor='var(--acc)'}));
  dz.addEventListener('dragleave',()=>dz.style.borderColor='');
  dz.addEventListener('drop',async e=>{e.preventDefault();dz.style.borderColor='';take(await filesFromDrop(e.dataTransfer))});
}
async function importMine(out){
  const parts={};
  for(const k of ['watched','ratings','watchlist']) if(out[k]) parts[k]=await readLB(out[k]);
  const seenRows=[...(parts.watched||[]),...(parts.ratings||[])], wantRows=parts.watchlist||[];
  const all=new Map(); [...seenRows,...wantRows].forEach(x=>all.set(x.name+'|'+x.year,x));
  const todo=[...all.values()]; let i=0, done=0;
  const bar=$('#impBar'); bar.style.display='block'; bar.max=todo.length; bar.value=0;
  const worker=async()=>{while(i<todo.length){const x=todo[i++];
    try{await lbMatch(x.name,x.year)}catch{}
    done++; bar.value=done; $('#imp').textContent=`Matching films… ${done}/${todo.length}`}};
  await Promise.all([...Array(6)].map(worker));
  const get=x=>matchCache[x.name+'|'+x.year], missed=new Set(), stamp=Date.now();
  let addedSeen=0, addedWant=0;
  seenRows.forEach((x,idx)=>{const m=get(x);if(!m){missed.add(x.name+x.year);return}
    if(!seen[m.id]){seen[m.id]={...m,ts:stamp-idx};addedSeen++} delete want[m.id]; delete skip[m.id]});
  wantRows.forEach(x=>{const m=get(x);if(!m){missed.add(x.name+x.year);return}
    if(!seen[m.id]&&!want[m.id]){want[m.id]={...m,ts:stamp};delete skip[m.id];addedWant++}});
  saveAll(); safeSave('matchCache',matchCache);
  $('#imp').textContent=`Done: ${addedSeen} added to seen, ${addedWant} to watchlist`+(missed.size?`, ${missed.size} couldn't be matched`:'')+'.';
  setTimeout(renderLists,2500);
}
function exportSeen(){
  const csv='Name,Year,TMDB id\n'+Object.values(seen).map(m=>`"${m.title.replace(/"/g,'""')}",${yr(m)},${m.id}`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='seen.csv';a.click();
}
